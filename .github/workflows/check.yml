name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  release-selection:
    name: Test release selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: ./tests/release-workflow.ps1
        shell: pwsh

  verify:
    name: Verify (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [windows, linux]
    runs-on: ${{ matrix.target == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          path: tools
          persist-credentials: false

      - uses: ./tools/.github/actions/verify-package
        with:
          source-ref: ${{ github.sha }}
          version: 0.0.0-ci
          target: ${{ matrix.target }}
      - name: Verify browser checkpoint saves
        working-directory: source
        run: node tests/browser-save.cjs
      - name: Verify diagnostics and backup recovery in Chromium
        working-directory: source
        run: node tests/browser-diagnostics.cjs
      - name: Verify startup and quiet reconnection in Chromium
        working-directory: source
        env:
          TIDE_TEST_LAUNCHER: "${{ github.workspace }}/dist/release/${{ matrix.target == 'windows' && '鱼来.exe' || 'fishcome' }}"
        run: node tests/browser-startup-reconnect.cjs
      - name: Verify interrupted first join in Chromium
        working-directory: source
        run: node tests/browser-replica-scale.cjs 10000
      - name: Verify feeding, camera input and background steps in Chromium
        working-directory: source
        run: node tests/browser-fish-capacity.cjs 1000 15
