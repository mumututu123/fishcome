name: Release

on:
  pull_request:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签，例如 v0.1.1；不存在时发布所选分支并创建标签'
        default: 'v0.1.1'
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.selection.outputs.tag }}
      version: ${{ steps.selection.outputs.version }}
      commit: ${{ steps.selection.outputs.commit }}
      tag_exists: ${{ steps.selection.outputs.tag_exists }}
      platforms: ${{ steps.selection.outputs.platforms }}
      legacy: ${{ steps.selection.outputs.legacy }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test release selection
        run: ./tests/release-workflow.ps1

      - name: Resolve source and version
        id: selection
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ($env:EVENT_NAME -eq 'pull_request') {
            $release = @{ Version = '0.0.0-ci'; Commit = $env:GITHUB_SHA }
          } else {
            $release = ./scripts/resolve-release.ps1 -Tag $env:REQUESTED_TAG -EventName $env:EVENT_NAME -EnvironmentFile ''
            "tag=$($release.Tag)" >> $env:GITHUB_OUTPUT
            "tag_exists=$($release.TagExists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          }
          $legacy = !(Test-Path -LiteralPath './go.mod' -PathType Leaf) -and (Test-Path -LiteralPath './launcher/Program.cs' -PathType Leaf)
          $platforms = if ($legacy) { '["windows"]' } else { '["windows","linux"]' }
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT
          "commit=$($release.Commit)" >> $env:GITHUB_OUTPUT
          "legacy=$($legacy.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "platforms=$platforms" >> $env:GITHUB_OUTPUT

  verify:
    needs: resolve
    name: Verify (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.platforms) }}
    runs-on: ${{ matrix.target == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_TARGET: ${{ matrix.target }}
      TIDE_TEST_MODULES: ${{ github.workspace }}/source/node_modules
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - uses: actions/setup-go@v6
        if: needs.resolve.outputs.legacy != 'true'
        with:
          go-version-file: source/go.mod
          cache-dependency-path: |
            source/go.mod
            source/go.sum
            tools/scripts/packaging/go.sum

      - name: Install JavaScript dependencies
        working-directory: source
        run: npm ci

      - name: Install Chromium
        working-directory: source
        run: |
          $options = @()
          if ($env:RELEASE_TARGET -eq 'linux') { $options += '--with-deps' }
          npx playwright install chromium @options

      - name: Test game rules
        working-directory: source
        run: npm test

      - name: Check Go code
        if: needs.resolve.outputs.legacy != 'true'
        working-directory: source
        run: go test ./...

      - name: Build ZIP
        if: needs.resolve.outputs.legacy != 'true'
        run: ./tools/build.ps1 -Version $env:RELEASE_VERSION -OutputDirectory ./dist/release -SourceDirectory ./source -TargetOS $env:RELEASE_TARGET

      - name: Rebuild historical Windows ZIP
        if: needs.resolve.outputs.legacy == 'true'
        working-directory: source
        run: ./build.ps1 -Version $env:RELEASE_VERSION -OutputDirectory ./dist/release

      - name: Verify extracted package in Chromium
        env:
          LEGACY_WINDOWS: ${{ needs.resolve.outputs.legacy }}
        run: ./tools/scripts/test-release.ps1 -ArchivePath $env:RELEASE_ARCHIVE -SourceDirectory ./source -BrowserTestPath ./tools/tests/browser-release.cjs -LegacyWindows:($env:LEGACY_WINDOWS -eq 'true')

      - name: Check packaging cleanup
        run: |
          $leftovers = @(Get-ChildItem -LiteralPath ./source/dist -Directory -Force | Where-Object { $_.Name -match '^\.(build|smoke)-[0-9a-f]{32}$' })
          if ($leftovers.Count) { throw "构建或验证脚本需要清理临时目录：$($leftovers.Name -join '、')" }

      - name: Verify launcher hot update
        if: needs.resolve.outputs.legacy != 'true'
        working-directory: source
        run: node tests/hot-update-launcher.cjs

      - name: Verify browser hot update
        if: needs.resolve.outputs.legacy != 'true'
        working-directory: source
        run: node tests/hot-update.cjs

      - name: Verify hot update from the C# launcher
        if: matrix.target == 'windows' && needs.resolve.outputs.legacy != 'true'
        working-directory: source
        run: node tests/hot-update-legacy-windows.cjs

      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: package-${{ matrix.target }}
          path: ${{ env.RELEASE_ARCHIVE }}
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name != 'pull_request'
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      RELEASE_TAG_EXISTS: ${{ needs.resolve.outputs.tag_exists }}
      LEGACY_WINDOWS: ${{ needs.resolve.outputs.legacy }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: packages
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $names = @("fishcome-$env:RELEASE_VERSION-windows.zip")
          if ($env:LEGACY_WINDOWS -ne 'true') { $names += "fishcome-$env:RELEASE_VERSION-linux-amd64.zip" }
          $assets = @(Get-ChildItem -LiteralPath packages -File)
          if (@(Compare-Object $names @($assets.Name) -CaseSensitive).Count -ne 0) { throw '发行附件和已验证的包名不一致' }
          $archives = $assets.FullName
          $download = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG"
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @"
          - Windows 10/11：下载 [$($names[0])]($download/$($names[0]))，完整解压后双击 **鱼来.exe**。
          "@ | Set-Content -LiteralPath $notes -Encoding utf8
          if ($names.Count -eq 2) {
            "- Linux x64：下载 [$($names[1])]($download/$($names[1]))，完整解压后运行 **./fishcome**。" | Add-Content -LiteralPath $notes -Encoding utf8
          }
          @"

          无需安装 Node.js 或 Python。保留程序旁的 www 文件夹。首次进入时设置昵称，在「连接同事」中粘贴邀请码。

          [用户简明手册](https://github.com/$env:GITHUB_REPOSITORY/blob/$env:RELEASE_TAG/游戏简介.md)
          "@ | Add-Content -LiteralPath $notes -Encoding utf8

          $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" --jq '.object' 2>$null
          $tagExists = $LASTEXITCODE -eq 0
          if ($tagExists) {
            $target = $ref | ConvertFrom-Json
            while ($target.type -eq 'tag') {
              $annotation = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($target.sha)" --jq '.object'
              if ($LASTEXITCODE -ne 0) { throw '无法读取发行标签对应的提交' }
              $target = $annotation | ConvertFrom-Json
            }
            if ($target.type -ne 'commit' -or $target.sha -cne $env:RELEASE_COMMIT) { throw '发行标签指向的提交已变更，请重新运行验证' }
          } elseif ($env:RELEASE_TAG_EXISTS -eq 'true') {
            throw '无法确认已验证的发行标签'
          }

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not $tagExists) { throw '无法确认现有发行对应的标签，请重新运行验证' }
            gh release upload $env:RELEASE_TAG @archives --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw '发行附件上传失败' }
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --notes-file $notes
          } else {
            $arguments = @('release', 'create', $env:RELEASE_TAG) + $archives + @('--repo', $env:GITHUB_REPOSITORY, '--target', $env:RELEASE_COMMIT, '--title', "鱼来 $env:RELEASE_TAG", '--notes-file', $notes)
            if ($tagExists) { $arguments += '--verify-tag' }
            if ($env:RELEASE_VERSION.Contains('-')) { $arguments += '--prerelease' }
            gh @arguments
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release 发布失败' }
