name: Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签，例如 v0.1.0；不存在时发布所选分支并创建标签'
        default: 'v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_EVENT: ${{ github.event_name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test release selection
        run: ./tests/release-workflow.ps1

      - name: Resolve release version and commit
        run: ./scripts/resolve-release.ps1 -Tag $env:RELEASE_TAG -EventName $env:RELEASE_EVENT

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Test game rules
        run: npm test

      - name: Build minimal Windows ZIP
        run: ./build.ps1 -Version $env:RELEASE_VERSION -OutputDirectory ./dist/release

      - name: Verify extracted package starts
        run: ./scripts/test-release.ps1 -ArchivePath "./dist/鱼来-$env:RELEASE_VERSION.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "./dist/鱼来-$env:RELEASE_VERSION.zip"
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $archive --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            @"
          下载下方的 **鱼来-$env:RELEASE_VERSION.zip**，完整解压后双击文件夹根目录的 **鱼来.exe**。

          适用于 Windows 10/11，无需安装 Node.js 或 Python。保留程序旁的 www 文件夹。首次进入设置昵称，在「连接同事」中粘贴邀请码。

          [用户简明手册](https://github.com/$env:GITHUB_REPOSITORY/blob/$env:RELEASE_TAG/游戏简介.md)
          "@ | Set-Content -LiteralPath $notes -Encoding utf8
            $arguments = @('release', 'create', $env:RELEASE_TAG, $archive, '--repo', $env:GITHUB_REPOSITORY, '--target', $env:RELEASE_COMMIT, '--title', "鱼来 $env:RELEASE_TAG", '--notes-file', $notes)
            if ($env:RELEASE_TAG_EXISTS -eq 'true') { $arguments += '--verify-tag' }
            if ($env:RELEASE_VERSION.Contains('-')) { $arguments += '--prerelease' }
            gh @arguments
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
