<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>接入鱼来</title><link rel="stylesheet" href="style.css"></head><body style="overflow:auto;background:linear-gradient(#184b6b,#051425);min-height:100vh;display:grid;place-items:center"><main class="panel" style="padding:40px;width:min(520px,90vw)"><div class="dialogBrand">o&gt; 鱼来</div><h1>有人在这片海等你</h1><p id="launchGuide" class="quiet">完整解压便携启动包，再运行里面的启动器。若使用不同系统，请先下载适合自己系统的发布包，再粘贴下方邀请码。每个人从自己的本地启动器进入，身份和记忆留在自己的浏览器里。</p><a id="downloadPackage" class="button primary" href="/download.zip" style="display:block;text-align:center;margin:25px 0">下载启动包</a><label>进入后，在「连接同事」里粘贴此邀请码<input id="address" readonly spellcheck="false"></label><button id="copy" style="width:100%" disabled>复制邀请码</button><p id="inviteStatus" class="quiet" role="status"></p><p class="quiet">邀请码由这台电脑生成，无需中心服务器。它隐藏分享文本中的明文地址；P2P 直连的对端仍可获取连接 IP。</p><p class="quiet">Chrome、Firefox、Edge 浏览器。启动器只提供网页和配对，不保存世界状态。无需安装 Node.js 或 Python。</p></main><script type="module" src="welcome.js"></script></body></html>
