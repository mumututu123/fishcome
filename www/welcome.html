<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>接入鱼来</title><link rel="stylesheet" href="style.css"></head><body style="overflow:auto;background:linear-gradient(#184b6b,#051425);min-height:100vh;display:grid;place-items:center"><main class="panel" style="padding:40px;width:min(520px,90vw)"><div class="dialogBrand">o&gt; 鱼来</div><h1>有人在这片海等你</h1><p class="quiet">下载便携启动包，解压后双击「鱼来.exe」。每个人从自己的固定本地地址进入，身份和记忆留在自己的浏览器里。</p><a class="button primary" href="/download.zip" style="display:block;text-align:center;margin:25px 0">下载启动包 · Windows</a><label>进入后，在「连接同事」里粘贴此地址<input id="address" readonly></label><button id="copy" style="width:100%">复制发布地址</button><p class="quiet">Chrome、Firefox、Edge 浏览器。启动器只提供网页和配对，不保存世界状态。无需安装 Node.js 或 Python。</p></main><script>document.getElementById('address').value=location.origin;document.getElementById('copy').onclick=()=>{const a=document.getElementById('address');a.select();document.execCommand('copy');document.getElementById('copy').textContent='已复制'};</script></body></html>
